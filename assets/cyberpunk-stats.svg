<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000d00" />
      <stop offset="100%" stop-color="#001800" />
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF41" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Faint Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00FF41" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg-grad)" />

  <!-- Grid -->
  <rect width="900" height="220" fill="url(#grid)" />

  <!-- Animated Glowing Outer Border -->
  <rect x="15" y="15" width="870" height="190" rx="6" fill="none" stroke="#00FF41" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Corner Brackets Accents -->
  <path d="M 30 15 L 15 15 L 15 30" stroke="#00FF41" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M 870 15 L 885 15 L 885 30" stroke="#00FF41" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M 15 190 L 15 205 L 30 205" stroke="#00FF41" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M 885 190 L 885 205 L 870 205" stroke="#00FF41" stroke-width="3" fill="none" filter="url(#glow)" />

  <!-- Scanline Sweep -->
  <rect x="15" y="15" width="870" height="20" fill="url(#scanline-grad)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 170" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Title -->
  <text x="450" y="45" fill="#00FF41" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2" filter="url(#glow)">
    ⚡ AMALDEV M — SYSTEM STATUS ⚡
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
  </text>

  <!-- Vertical Dividers -->
  <line x1="230" y1="65" x2="230" y2="165" stroke="#00FF41" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
  <line x1="450" y1="65" x2="450" y2="165" stroke="#00FF41" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
  <line x1="670" y1="65" x2="670" y2="165" stroke="#00FF41" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- STAT BLOCK 1: TOTAL CONTRIBUTIONS -->
  <text x="122" y="82" fill="#00FF41" fill-opacity="0.7" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">TOTAL CONTRIBUTIONS</text>
  <text x="122" y="115" fill="#00FF41" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold" text-anchor="middle" filter="url(#glow)">309</text>
  <!-- Fill Bar -->
  <rect x="42" y="132" width="160" height="12" rx="3" fill="#000d00" stroke="#00FF41" stroke-width="1" stroke-opacity="0.4" />
  <rect x="44" y="134" height="8" rx="2" fill="#00FF41" filter="url(#glow)">
    <animate attributeName="width" from="0" to="117" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
  </rect>

  <!-- STAT BLOCK 2: CURRENT STREAK -->
  <text x="340" y="78" fill="#00FF41" fill-opacity="0.7" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">CURRENT STREAK</text>
  <!-- Spinning Circle Ring -->
  <g transform="translate(340, 130)">
    <circle cx="0" cy="0" r="32" stroke="#00FF41" stroke-width="1.5" fill="none" stroke-dasharray="6 4" stroke-opacity="0.8" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>
  <text x="340" y="124" fill="#00FF41" fill-opacity="0.6" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="middle">STREAK</text>
  <text x="340" y="142" fill="#00FF41" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" text-anchor="middle" filter="url(#glow)">2</text>

  <!-- STAT BLOCK 3: LONGEST STREAK -->
  <text x="560" y="82" fill="#00FF41" fill-opacity="0.7" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">LONGEST STREAK</text>
  <text x="560" y="115" fill="#00FF41" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold" text-anchor="middle" filter="url(#glow)">7</text>
  <!-- Fill Bar -->
  <rect x="480" y="132" width="160" height="12" rx="3" fill="#000d00" stroke="#00FF41" stroke-width="1" stroke-opacity="0.4" />
  <rect x="482" y="134" height="8" rx="2" fill="#00FF41" filter="url(#glow)">
    <animate attributeName="width" from="0" to="140" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
  </rect>

  <!-- STAT BLOCK 4: PUBLIC REPOS -->
  <text x="780" y="82" fill="#00FF41" fill-opacity="0.7" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">PUBLIC REPOS</text>
  <text x="780" y="115" fill="#00FF41" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold" text-anchor="middle" filter="url(#glow)">49</text>
  <!-- Fill Bar -->
  <rect x="700" y="132" width="160" height="12" rx="3" fill="#000d00" stroke="#00FF41" stroke-width="1" stroke-opacity="0.4" />
  <rect x="702" y="134" height="8" rx="2" fill="#00FF41" filter="url(#glow)">
    <animate attributeName="width" from="0" to="76" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
  </rect>

  <!-- Status Bar Footer -->
  <text x="35" y="193" fill="#00FF41" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" letter-spacing="1">
    STATUS: ONLINE
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </text>
  <text x="865" y="193" fill="#00FF41" fill-opacity="0.6" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" text-anchor="end" letter-spacing="1">SYS_VER: 2.0.26</text>
</svg>
